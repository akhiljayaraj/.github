name: "✨ Feature request"
description: Propose new functionality
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes: { label: "Problem", description: "What need does this address?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
